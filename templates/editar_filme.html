<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Filme</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Editar Filme #{{ filme[0] }}</h1>

    <form action="/filmes/atualizar/{{ filme[0] }}" method="POST">

        <label>Título</label>
        <input type="text" name="titulo" maxlength="100"
               value="{{ filme[1] }}" required>

        <label>Gênero</label>
        <input type="text" name="genero" maxlength="100"
               value="{{ filme[2] }}" required>

        <label>Duração (minutos)</label>
        <input type="number" name="duracao_min"
               value="{{ filme[3] }}" required>

        <label>Data de lançamento</label>
        <input type="date" name="data_lancamento"
               value="{{ filme[4] }}" required>

        <button type="submit">Salvar Alterações</button>

        <a href="/filmes">Cancelar</a>

    </form>

</body>
</html>
