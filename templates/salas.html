<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Salas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Gerenciamento de Salas</h1>

<form action="/salas/enviar" method="POST">

    <label>Nome</label>
    <input type="text" name="nome" maxlength="100" required>

    <label>Tipo</label>
    <input type="text" name="tipo" maxlength="100" required>

    <label>Capacidade</label>
    <input type="number" name="capacidade" required>

    <label>Preço do ingresso (R$)</label>
    <input type="number" name="preco_ingresso"
           step="0.01" required>

    <button type="submit">Adicionar Sala</button>

</form>

<table>
    <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Tipo</th>
        <th>Capacidade</th>
        <th>Preço do ingresso</th>
        <th>Ações</th>
    </tr>

    {% for sala in salas %}
    <tr>
        <td>{{ sala[0] }}</td>
        <td>{{ sala[1] }}</td>
        <td>{{ sala[2] }}</td>
        <td>{{ sala[3] }}</td>
        <td>R$ {{ sala[4] }}</td>

        <td class="acoes">

            <a class="botao editar"
               href="/salas/editar/{{ sala[0] }}">
                Editar
            </a>

            <form action="/salas/excluir/{{ sala[0] }}" method="POST">
                <button type="submit">Excluir</button>
            </form>

        </td>
    </tr>

    {% else %}
    <tr>
        <td colspan="6">Nenhuma sala cadastrada.</td>
    </tr>
    {% endfor %}

</table>

<br>
<a href="/">Voltar ao início</a>

</body>
</html>
